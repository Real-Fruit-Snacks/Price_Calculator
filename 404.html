<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page Not Found - Dog Sitting At Danni's House</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#F0EAFF">

    <!-- Same saved-theme handling as the main page, applied before first paint -->
    <script>
        (function () {
            var theme = null;
            try { theme = localStorage.getItem('preferred-theme'); } catch (e) {}
            if (!theme) {
                theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <!-- This page is self-contained (no external stylesheet, favicon or script) so it renders
         correctly at any mistyped address, including nested paths. -->
    <style>
        :root {
            --crust:    #F0EAFF;
            --mantle:   #FFFFFF;
            --base:     #F8F5FF;
            --surface0: #E0D4F7;
            --surface1: #D4C4F0;
            --text:     #2D1B5E;
            --subtext0: #6B5B8D;
            --accent-text:   #5B3FC4;
            --btn-gradient:  linear-gradient(135deg, #5B3FC4, #007A70);
            --btn-text:      #FFFFFF;
            --text-gradient: linear-gradient(135deg, #5B3FC4, #007A70);
        }

        [data-theme="dark"] {
            --crust:    #1A0D2E;
            --mantle:   #261240;
            --base:     #321852;
            --surface0: #3E1F64;
            --surface1: #4A2576;
            --text:     #F0EAFF;
            --subtext0: #D4C4F0;
            --accent-text:   #D4C4F0;
            --btn-gradient:  linear-gradient(135deg, #D4C4F0, #00F0DE);
            --btn-text:      #1A0D2E;
            --text-gradient: linear-gradient(135deg, #D4C4F0, #00F0DE);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--crust);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        nav {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 2rem;
            border-bottom: 1px solid var(--surface0);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 18px;
            color: var(--text);
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 1.5rem;
        }

        .card {
            max-width: 560px;
            width: 100%;
            text-align: center;
            background: var(--mantle);
            border: 1px solid var(--surface0);
            border-radius: 20px;
            padding: 3rem 2rem;
        }

        .card svg {
            width: 72px;
            height: 72px;
            margin-bottom: 1.5rem;
        }

        .code {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-text);
            margin-bottom: 0.75rem;
        }

        h1 {
            text-wrap: balance;
            font-size: 34px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
            background: var(--text-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            color: var(--subtext0);
            font-size: 17px;
            margin-bottom: 2rem;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary,
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.9rem 1.75rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .btn-primary {
            background: var(--btn-gradient);
            color: var(--btn-text);
        }

        .btn-secondary {
            background: var(--surface0);
            color: var(--text);
            border: 1px solid var(--surface1);
        }

        .btn-primary:hover,
        .btn-secondary:hover {
            transform: translateY(-2px);
        }

        :focus-visible {
            outline: 3px solid var(--accent-text);
            outline-offset: 2px;
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--subtext0);
            font-size: 14px;
            border-top: 1px solid var(--surface0);
        }

        @media (max-width: 480px) {
            nav { padding: 0 1rem; height: 56px; }
            .card { padding: 2.5rem 1.5rem; }
            h1 { font-size: 28px; }
            .btn-primary, .btn-secondary { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .btn-primary, .btn-secondary { transition: none; }
        }
    </style>
</head>
<body>
    <nav aria-label="Main">
        <a class="nav-logo home-link" href="./">
            <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">
                <defs>
                    <linearGradient id="pawGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#B8A5E8;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#00D4C4;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <ellipse cx="16" cy="20" rx="6.7" ry="6" fill="url(#pawGradient)" />
                <ellipse cx="10.7" cy="12" rx="2.7" ry="3.7" fill="url(#pawGradient)" />
                <ellipse cx="16" cy="10" rx="2.7" ry="3.7" fill="url(#pawGradient)" />
                <ellipse cx="21.3" cy="12" rx="2.7" ry="3.7" fill="url(#pawGradient)" />
                <ellipse cx="8" cy="16" rx="2.4" ry="3.3" fill="url(#pawGradient)" />
                <ellipse cx="24" cy="16" rx="2.4" ry="3.3" fill="url(#pawGradient)" />
            </svg>
            Danni's House
        </a>
    </nav>

    <main>
        <div class="card">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">
                <ellipse cx="16" cy="20" rx="6.7" ry="6" fill="url(#pawGradient)" />
                <ellipse cx="10.7" cy="12" rx="2.7" ry="3.7" fill="url(#pawGradient)" />
                <ellipse cx="16" cy="10" rx="2.7" ry="3.7" fill="url(#pawGradient)" />
                <ellipse cx="21.3" cy="12" rx="2.7" ry="3.7" fill="url(#pawGradient)" />
                <ellipse cx="8" cy="16" rx="2.4" ry="3.3" fill="url(#pawGradient)" />
                <ellipse cx="24" cy="16" rx="2.4" ry="3.3" fill="url(#pawGradient)" />
            </svg>
            <div class="code">Error 404</div>
            <h1>That page wandered off</h1>
            <p>The page you're looking for doesn't exist or has moved. Head back to the home page or jump straight to an estimate.</p>
            <div class="buttons">
                <a class="btn-primary home-link" href="./">Back to Home</a>
                <a class="btn-secondary home-link" href="./" data-hash="#calculator">Get an Estimate</a>
            </div>
        </div>
    </main>

    <footer>
        © <span id="year">2025</span> Dog Sitting At Danni's House
    </footer>

    <script>
        // Point the links at the site's home page whatever address was mistyped.
        // On a GitHub Pages project site the home page lives under the repository name,
        // e.g. /Price_Calculator/, so keep the first path segment in that case.
        (function () {
            var home = '/';
            var host = location.hostname;
            var first = location.pathname.split('/')[1];
            if (/github\.io$/i.test(host) && first) {
                home = '/' + first + '/';
            }
            document.querySelectorAll('.home-link').forEach(function (a) {
                a.setAttribute('href', home + (a.dataset.hash || ''));
            });
            document.getElementById('year').textContent = new Date().getFullYear();
        })();
    </script>
</body>
</html>
